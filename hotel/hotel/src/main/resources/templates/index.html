<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Grand Hotel - Reservasi Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1571896349842-33c89424de2d?q=80&w=1920') no-repeat center center/cover;
            color: white;
            padding: 80px 0;
            text-align: center;
        }
    </style>
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#">🏨 GRAND HOTEL</a>
            <div class="ms-auto">
                <a th:href="@{/login}" class="btn btn-outline-warning btn-sm">🔑 Login Admin</a>
            </div>
        </div>
    </nav>

    <!-- HERO HEADER -->
    <div class="hero-section shadow">
        <div class="container">
            <h1 class="display-4 fw-bold">Selamat Datang di Grand Hotel</h1>
            <p class="lead">Nikmati pengalaman menginap mewah dengan fasilitas terbaik dan pemesanan kamar instan.</p>
        </div>
    </div>

    <!-- MAIN FORM SECTION -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <!-- Alert Handling -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                    <strong th:text="${errorMessage}">Error</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                    <strong th:text="${successMessage}">Sukses</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Form Card -->
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0 fw-bold">Form Pemesanan Kamar</h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/pesan}" th:object="${reservasi}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama Lengkap Anda</label>
                                <input type="text" th:field="*{namaTamu}" class="form-control form-control-lg" placeholder="Masukkan nama sesuai KTP" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Pilih Tipe Kamar</label>
                                <select th:field="*{tipeKamar}" class="form-select form-select-lg">
                                    <option value="Standard">Standard Room (Maks 3 Slot)</option>
                                    <option value="Deluxe">Deluxe Room (Maks 3 Slot)</option>
                                    <option value="Suite">Suite Room (Maks 3 Slot)</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Tanggal Check-In</label>
                                    <input type="date" th:field="*{tanggalCheckIn}" class="form-control" required />
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Tanggal Check-Out</label>
                                    <input type="date" th:field="*{tanggalCheckOut}" class="form-control" required />
                                </div>
                            </div>
                            <button type="submit" class="btn btn-warning btn-lg text-dark fw-bold w-100 mt-3 shadow-sm">Konfirmasi & Pesan Sekarang</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <footer class="bg-dark text-white-50 py-3 text-center mt-5">
        <small>&copy; 2026 Grand Hotel System. All Rights Reserved.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
