<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Admin - Grand Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary d-flex align-items-center" style="height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                
                <div th:if="${loginError}" class="alert alert-danger shadow-sm text-center" role="alert">
                    <span th:text="${loginError}">Gagal</span>
                </div>

                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold text-dark">Portal Admin</h3>
                        <form th:action="@{/login}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Masukkan username" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Masukkan password" required />
                            </div>
                            <button type="submit" class="btn btn-dark w-100 py-2 mt-2 shadow-sm">Masuk Sistem</button>
                        </form>
                        <div class="text-center mt-3">
                            <a th:href="@{/}" class="text-muted small">&larr; Kembali ke Beranda</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
